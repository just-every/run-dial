name: Scheduled and release journeys

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit, tag or branch to verify (empty uses the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  journeys:
    name: ${{ matrix.journey }} journey
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Cron waits for real scheduled minutes and exceeded 18 minutes in the
        # prior run; installer exercises the complete README clone/restore flow.
        journey: [installer, cron]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Reserve native fixture listeners before starting runtimes
        run: |
          ports="$(node scripts/ci-runtime-ports.mjs)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
          node scripts/ci-runtime-ports.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Identify browser journey
        id: browser
        run: node scripts/ci/browser-needed.mjs journeys ${{ matrix.journey }} >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        if: steps.browser.outputs.browser == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          if ! pnpm exec node scripts/chromium-probe.mjs; then
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          fi
      - name: Run complete slow journey
        env:
          DIAL_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/dial-test-diagnostics
        run: |
          node scripts/monitor-test-workers.mjs &
          monitor="$!"
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$PWD/scripts/test-worker-diagnostics.mjs"
          node scripts/ci-verify.mjs journeys ${{ matrix.journey }}
