name: Verify

on:
  push:
    branches:
      - main
      - "cloud/**"
      - pr-dial-export-fix
      - "style/**"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each runner owns its native listeners/state. The slow README installation
    # and real-time Cron journey live in nightly-journeys.yml; all other test
    # files are discovered and assigned exactly once by ci-test-files.mjs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static and migrations
            args: static
          - name: Build and native hosted checks
            args: build
          - name: Managed editor
            args: editor
          - name: Tests 1 of 22
            args: test 0
          - name: Tests 2 of 22
            args: test 1
          - name: Tests 3 of 22
            args: test 2
          - name: Tests 4 of 22
            args: test 3
          - name: Tests 5 of 22
            args: test 4
          - name: Tests 6 of 22
            args: test 5
          - name: Tests 7 of 22
            args: test 6
          - name: Tests 8 of 22
            args: test 7
          - name: Tests 9 of 22
            args: test 8
          - name: Tests 10 of 22
            args: test 9
          - name: Tests 11 of 22
            args: test 10
          - name: Tests 12 of 22
            args: test 11
          - name: Tests 13 of 22
            args: test 12
          - name: Tests 14 of 22
            args: test 13
          - name: Tests 15 of 22
            args: test 14
          - name: Tests 16 of 22
            args: test 15
          - name: Tests 17 of 22
            args: test 16
          - name: Tests 18 of 22
            args: test 17
          - name: Tests 19 of 22
            args: test 18
          - name: Tests 20 of 22
            args: test 19
          - name: Tests 21 of 22
            args: test 20
          - name: Tests 22 of 22
            args: test 21
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim disposable hosted-runner SDKs for native CLI proof
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == "true" && "$RUNNER_ENVIRONMENT" == "github-hosted" && "$RUNNER_OS" == "Linux" ]]
          available_bytes() {
            df -B1 --output=avail "$1" | tail -n 1 | tr -d ' '
          }
          printf 'Before checkout available bytes: %s\n' "$(available_bytes "$GITHUB_WORKSPACE")"
          printf 'Before temporary available bytes: %s\n' "$(available_bytes "$RUNNER_TEMP")"
          # Dial uses none of these preinstalled SDKs. Keep the native CLI's real disk guard.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          printf 'After checkout available bytes: %s\n' "$(available_bytes "$GITHUB_WORKSPACE")"
          printf 'After temporary available bytes: %s\n' "$(available_bytes "$RUNNER_TEMP")"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Reserve native fixture listeners before starting runtimes
        run: |
          ports="$(node scripts/ci-runtime-ports.mjs)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
          node scripts/ci-runtime-ports.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and native dependencies
        if: ${{ matrix.args != 'static' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mirrors=(runner-default http://mirrors.edge.kernel.org/ubuntu/ http://us-east-1.ec2.archive.ubuntu.com/ubuntu/)
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            printf 'Chromium apt: attempt %s/3 (60s deadline; mirror %s)\n' "$attempt" "$mirror"
            # Elevate before timeout: otherwise sudo's child can outlive the
            # deadline and retain dpkg's lock into the next mirror attempt.
            if sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS timeout --kill-after=5s 60s bash -ec '
              export PLAYWRIGHT_BROWSERS_PATH="$4"
              "$1" scripts/ci-apt-bootstrap.mjs "$3"
              dpkg --configure -a
              "$1" "$2" install --with-deps chromium
            ' bash "$(command -v node)" "$(node -p "require.resolve('@playwright/test/package.json').replace(/package.json$/, 'cli.js')")" "$mirror" "$HOME/.cache/ms-playwright"; then
              exit 0
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s; exit %s)\n' "$attempt" "$mirror" "$status" >&2
            fi
          done
          exit "$status"
      - name: Run verification partition
        env:
          DIAL_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/dial-test-diagnostics
        run: |
          node scripts/monitor-test-workers.mjs &
          monitor="$!"
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$PWD/scripts/test-worker-diagnostics.mjs"
          node scripts/ci-verify.mjs ${{ matrix.args }}
