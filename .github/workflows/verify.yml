name: Verify

on:
  push:
    branches:
      - main
      - "cloud/**"
      - pr-dial-export-fix
      - "style/**"

  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: bash scripts/ci/verify-plan.sh

  checks:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Each runner owns its native listeners/state. The slow README installation
    # and real-time Cron journey live in nightly-journeys.yml; all other test
    # files are discovered and assigned exactly once by ci-test-files.mjs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static and migrations
            args: static
          - name: Build and native hosted checks
            args: build
          - name: Managed editor
            args: editor
          - name: Tests 1 of 22
            args: test 0
          - name: Tests 2 of 22
            args: test 1
          - name: Tests 3 of 22
            args: test 2
          - name: Tests 4 of 22
            args: test 3
          - name: Tests 5 of 22
            args: test 4
          - name: Tests 6 of 22
            args: test 5
          - name: Tests 7 of 22
            args: test 6
          - name: Tests 8 of 22
            args: test 7
          - name: Tests 9 of 22
            args: test 8
          - name: Tests 10 of 22
            args: test 9
          - name: Tests 11 of 22
            args: test 10
          - name: Tests 12 of 22
            args: test 11
          - name: Tests 13 of 22
            args: test 12
          - name: Tests 14 of 22
            args: test 13
          - name: Tests 15 of 22
            args: test 14
          - name: Tests 16 of 22
            args: test 15
          - name: Tests 17 of 22
            args: test 16
          - name: Tests 18 of 22
            args: test 17
          - name: Tests 19 of 22
            args: test 18
          - name: Tests 20 of 22
            args: test 19
          - name: Tests 21 of 22
            args: test 20
          - name: Tests 22 of 22
            args: test 21
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Reserve native fixture listeners before starting runtimes
        run: |
          ports="$(node scripts/ci-runtime-ports.mjs)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
          node scripts/ci-runtime-ports.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Identify browser partition
        id: browser
        run: node scripts/ci/browser-needed.mjs ${{ matrix.args }} >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        if: steps.browser.outputs.browser == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          if ! pnpm exec node scripts/chromium-probe.mjs; then
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          fi
      - name: Run verification partition
        env:
          DIAL_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/dial-test-diagnostics
        run: |
          node scripts/monitor-test-workers.mjs &
          monitor="$!"
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$PWD/scripts/test-worker-diagnostics.mjs"
          node scripts/ci-verify.mjs ${{ matrix.args }}

  verify:
    needs: [plan, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every partition
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
