name = "dial-provider-app-runtime-test"
main = "api-worker.ts"
compatibility_date = "2026-09-04"

[[d1_databases]]
binding = "DB"
database_name = "dial-provider-app-runtime-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations/core"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dial-provider-app-runtime-test-files"

[[queues.producers]]
binding = "JOBS"
queue = "dial-provider-app-runtime-test-jobs"

[[queues.consumers]]
queue = "dial-provider-app-runtime-test-jobs"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "dial-provider-app-runtime-test-jobs-dead"
