# The lifecycle journey runtime: the wire worker with production's Queue consumer, driven by rer's scheduler.
name = "dial-lifecycle-test"
main = "worker.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dial-lifecycle-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/core"

[[d1_databases]]
binding = "PROVIDER_DB"
database_name = "dial-lifecycle-edge"
database_id = "00000000-0000-0000-0000-000000000098"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dial-lifecycle-files"

[[queues.producers]]
binding = "JOBS"
queue = "dial-lifecycle-jobs"

[[queues.consumers]]
queue = "dial-lifecycle-jobs"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3

[[durable_objects.bindings]]
name = "BOOKING_COORDINATOR"
class_name = "BookingCoordinator"

[[migrations]]
tag = "v1-booking-coordinator"
new_sqlite_classes = ["BookingCoordinator"]

[vars]
OWNER_EMAIL = "operator@dial.test"
MAIL_FROM = "no-reply@dial.test"
SETUP_TOKEN = "dial-test-only-setup-token-at-least-32"
ENVIRONMENT = "development"
APP_URL = "http://127.0.0.1:15770"
GOOGLE_OAUTH_CLIENT_ID = "synthetic-client"
GOOGLE_OAUTH_CLIENT_SECRET = "synthetic-secret"
CALENDAR_WEBHOOK_SECRET = "synthetic-calendar-webhook-secret-for-test-only"
SESSION_SECRET = "synthetic-dial-lifecycle-synthetic-local-session-secret"

MAIL_PROVIDER = "sendgrid"
MAIL_API_KEY = "wire-mail-key"
MAIL_WEBHOOK_KEY = "test-only-wire-webhook-key"
