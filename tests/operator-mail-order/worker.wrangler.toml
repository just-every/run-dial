name = "dial-operator-mail-order-test"
main = "worker.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "../review/assets"
binding = "ASSETS"
run_worker_first = true
[vars]
OWNER_EMAIL = "operator@dial.test"
MAIL_FROM = "no-reply@dial.test"
SETUP_TOKEN = "dial-test-only-setup-token-at-least-32"
ENVIRONMENT = "preview"
APP_URL = "http://127.0.0.1:42000"
SESSION_SECRET = "synthetic-operator-mail-order-isolated-test-secret-only"
GOOGLE_OAUTH_CLIENT_ID = "synthetic-client"
GOOGLE_OAUTH_CLIENT_SECRET = "synthetic-secret"
CALENDAR_WEBHOOK_SECRET = "synthetic-calendar-webhook-secret-for-test-only"
[[d1_databases]]
binding = "DB"
database_name = "dial-operator-mail-order-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/core"

[[d1_databases]]
binding = "PROVIDER_DB"
database_name = "dial-operator-mail-order-test-providers"
database_id = "11111111-1111-1111-1111-111111111111"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dial-operator-mail-order-test"
[[queues.producers]]
binding = "JOBS"
queue = "dial-operator-mail-order-test"
[[durable_objects.bindings]]
name = "BOOKING_COORDINATOR"
class_name = "BookingCoordinator"
[[migrations]]
tag = "v1-booking-coordinator"
new_sqlite_classes = ["BookingCoordinator"]
