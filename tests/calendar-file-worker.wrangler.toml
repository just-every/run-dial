name = "dial-calendar-file-test"
main = "review/native-worker.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "review/assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dial-calendar-file-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations/core"

[[d1_databases]]
binding = "PROVIDER_DB"
database_name = "dial-calendar-file-provider"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dial-local-files"

[[queues.producers]]
binding = "JOBS"
queue = "dial-local-jobs"


[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "BOOKING_COORDINATOR"
class_name = "BookingCoordinator"

[[migrations]]
tag = "v1-booking-coordinator"
new_sqlite_classes = ["BookingCoordinator"]

[vars]
OWNER_EMAIL = "operator@dial.test"
MAIL_FROM = "no-reply@dial.test"
SETUP_TOKEN = "dial-test-only-setup-token-at-least-32"
ENVIRONMENT = "development"
APP_URL = "http://127.0.0.1:15719"
GOOGLE_OAUTH_CLIENT_ID = "synthetic-client"
GOOGLE_OAUTH_CLIENT_SECRET = "synthetic-secret"
CALENDAR_WEBHOOK_SECRET = "synthetic-calendar-webhook-secret-for-test-only"
SESSION_SECRET = "dial-task-review-session-secret-for-synthetic-data-only"

MAIL_PROVIDER = "development"
RER_DEV_KEY = "dial-test-only-dev-key-abcdef0123456789abcdef0123456789"
